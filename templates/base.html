<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KingBot 黄金模拟交易{% endblock %}</title>
    
    <!-- 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 引入 Lucide Icons 图标库用于 Apple 风格图标 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* CSS 变量定义 Apple 风格设计系统 */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0f17 0%, #1a1a26 100%);
            --card-bg: rgba(30, 30, 42, 0.6);
            --card-elevated: rgba(40, 40, 56, 0.95);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-glow: rgba(201, 100, 66, 0.04);
            
            --text-primary: #f5f0eb;
            --text-secondary: #9a958f;
            --text-tertiary: #5a564f;
            
            --primary: #C96442;          /* 暖金陶土主色 */
            --primary-hover: #d47a5a;
            --primary-glow: rgba(201, 100, 66, 0.18);
            
            --accent-gold: #D4A853;      /* 金价上涨信号 */
            --success: #1A6B52;          /* 松绿（跌/空头） */
            --danger: #d4453a;           /* 暖红（涨/多头） */
            --warning: #D4A853;
            
            --sidebar-width: 260px;
            --transition-swift: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --glass-blur: blur(25px);
        }

        /* 基础重置与滚动条样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 自定义精致滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 布局框架 */
        .app-container {
            display: flex;
            width: 100vw;
            min-height: 100vh;
        }

        /* Apple 风格毛玻璃侧边导航栏 */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(15, 15, 25, 0.6);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: var(--transition-swift);
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 8px 32px 8px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #D4A853 0%, #C96442 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(201, 100, 66, 0.35);
        }

        .brand-logo i {
            color: #12121c;
            stroke-width: 2.5;
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 导航链接 */
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
            transition: var(--transition-swift);
            cursor: pointer;
        }

        .nav-item i {
            width: 18px;
            height: 18px;
            transition: var(--transition-swift);
        }

        .nav-item:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
            transform: translateX(4px);
        }

        .nav-item.active {
            color: var(--text-primary);
            background: var(--primary);
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .nav-item.active i {
            color: var(--text-primary);
            transform: scale(1.05);
        }

        /* 侧边栏底部账户快捷卡片 */
        .sidebar-footer {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .footer-account-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
        }

        .footer-account-val {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* 主体内容展示区域 */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: var(--transition-swift);
        }

        /* 顶部状态栏与用户信息 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .page-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #d1d1d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .live-price-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
        }

        .live-price-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse-glow 2s infinite;
        }

        .live-price-indicator.simulated {
            background: #ff9f0a; /* 橙色表示模拟降级 */
            box-shadow: 0 0 10px #ff9f0a;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        /* 毛玻璃卡片系统 */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            transition: var(--transition-swift);
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at top right, var(--card-glow), transparent 60%);
            pointer-events: none;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.3);
        }

        /* 卡片层次体系：焦点卡 / 内容卡 / 辅助卡 */
        .card-hero {
            background: var(--card-elevated);
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 8px 32px rgba(201, 100, 66, 0.12);
            position: relative;
            overflow: hidden;
            transition: var(--transition-swift);
        }
        .card-hero::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 200px; height: 200px;
            background: radial-gradient(circle, var(--primary-glow), transparent 70%);
            pointer-events: none;
        }

        .card-content {
            background: var(--card-elevated);
            border: 0.5px solid rgba(201, 100, 66, 0.12);
            border-radius: 14px;
            padding: 22px;
            transition: var(--transition-swift);
        }
        .card-content:hover {
            border-color: rgba(201, 100, 66, 0.3);
        }

        .card-helper {
            background: transparent;
            border: none;
            border-radius: 12px;
            padding: 16px;
        }

        /* 各种按钮与微交互 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-swift);
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        /* 移动端响应式布局适配 */
        @media (max-width: 992px) {
            :root {
                --sidebar-width: 0px;
            }
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100vw;
                height: 60px;
                position: fixed;
                bottom: 0;
                top: auto;
                left: 0;
                right: 0;
                border-right: none;
                border-top: 1px solid var(--card-border);
                flex-direction: row;
                justify-content: space-around;
                padding: 0;
                border-radius: 16px 16px 0 0;
            }
            .brand-section {
                display: none;
            }
            .nav-menu {
                flex-direction: row;
                justify-content: space-around;
                width: 100%;
                gap: 0;
            }
            .nav-item {
                flex-direction: column;
                justify-content: center;
                gap: 4px;
                padding: 8px;
                font-size: 10px;
                border-radius: 0;
            }
            .nav-item:hover {
                transform: none;
            }
            .sidebar-footer {
                display: none;
            }
            .main-content {
                margin-left: 0;
                padding: 24px;
                padding-bottom: 80px; /* 留出底部导航空间 */
            }
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <!-- 侧边导航栏 -->
        <aside class="sidebar">
            <div class="brand-section">
                <div class="brand-logo">
                    <i data-lucide="gem"></i>
                </div>
                <h1 class="brand-title">KingBot Gold</h1>
            </div>
            
            <nav class="nav-menu">
                <a href="/" class="nav-item {% if active_page == 'index' %}active{% endif %}">
                    <i data-lucide="layout-dashboard"></i>
                    <span>交易仪表盘</span>
                </a>
                <a href="/trade" class="nav-item {% if active_page == 'trade' %}active{% endif %}">
                    <i data-lucide="arrow-left-right"></i>
                    <span>模拟交易</span>
                </a>
                <a href="/history" class="nav-item {% if active_page == 'history' %}active{% endif %}">
                    <i data-lucide="history"></i>
                    <span>交易历史</span>
                </a>
                <a href="/backtest" class="nav-item {% if active_page == 'backtest' %}active{% endif %}">
                    <i data-lucide="line-chart"></i>
                    <span>策略回测</span>
                </a>
                <a href="/logs" class="nav-item {% if active_page == 'logs' %}active{% endif %}">
                    <i data-lucide="scroll-text"></i>
                    <span>决策日志</span>
                </a>
                <a href="/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
                    <i data-lucide="settings"></i>
                    <span>系统设置</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="footer-account-title">可用资金 (CNY)</div>
                <div class="footer-account-val" id="sidebar-cash-display">¥100,000.00</div>
            </div>
        </aside>

        <!-- 主体展示区域 -->
        <main class="main-content">
            <header class="header-bar">
                <div class="page-info">
                    <h2 class="page-title">{% block page_title %}仪表盘{% endblock %}</h2>
                    <p class="page-subtitle">{% block page_subtitle %}上海黄金交易所 Au(T+D) 实时双向模拟交易系统{% endblock %}</p>
                </div>
                
                <div class="live-price-badge">
                    <span class="live-price-indicator" id="price-dot"></span>
                    <span id="price-badge-text">Au(T+D): -- 元/克</span>
                </div>
            </header>

            <!-- 渲染子模板具体内容 -->
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();

        // 统一从 /api/account 更新侧边栏现金状态
        function updateSidebarAccount() {
            fetch('/api/account')
                .then(response => response.json())
                .then(res => {
                    if(res.status === 'success') {
                        const formatter = new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY' });
                        // 动态更新侧边栏可用资金
                        document.getElementById('sidebar-cash-display').innerText = formatter.format(res.account.available_cash);
                    }
                })
                .catch(err => console.error("Error updating account sidebar:", err));
        }

        // 统一金价轮询更新
        function updateGlobalGoldPrice() {
            fetch('/api/price')
                .then(response => response.json())
                .then(res => {
                    if (res.status === 'success') {
                        const priceData = res.data;
                        const priceText = `Au(T+D): ${priceData.latest.toFixed(2)} 元/克`;
                        document.getElementById('price-badge-text').innerText = priceText;
                        
                        const dot = document.getElementById('price-dot');
                        if (priceData.is_simulated) {
                            dot.className = 'live-price-indicator simulated';
                        } else {
                            dot.className = 'live-price-indicator';
                        }
                    }
                })
                .catch(err => console.error("Error fetching live gold price:", err));
        }

        // 页面加载后立即调用一次，并设置轮询
        document.addEventListener('DOMContentLoaded', () => {
            updateSidebarAccount();
            updateGlobalGoldPrice();
            
            // 10秒轮询
            let intervalId = setInterval(() => {
                updateSidebarAccount();
                updateGlobalGoldPrice();
            }, 10000);

            // 切后台暂停轮询以节省开销
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    clearInterval(intervalId);
                } else {
                    updateSidebarAccount();
                    updateGlobalGoldPrice();
                    intervalId = setInterval(() => {
                        updateSidebarAccount();
                        updateGlobalGoldPrice();
                    }, 10000);
                }
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
